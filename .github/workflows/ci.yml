name: ci

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

jobs:
  customer-list-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Per-client listing rate, aggregate capacity and bounded timeout
        run: node tests/customer-list-budget.mjs

  customer-list-saga-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: code-corhuila/synkro-customers-api
          ref: cbd67c302c9649e417eaa69934a9741f3453c679
          path: customer-source
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: code-corhuila/synkro-workflow
          ref: 9c604f5948f27db6c43b5fca721d455651a81008
          path: workflow-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real saga and point read remain available with listing SQL held
        env:
          CUSTOMERS_API_REPO: ${{ github.workspace }}/customer-source
          WORKFLOW_REPO: ${{ github.workspace }}/workflow-source
        run: python tests/customer-list-saga.py

  check-common-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify common repository files exist
        run: |
          set -e
          test -f README.md
          test -f .gitignore
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .env.example
          echo "Common files present."

  smoke-test:
    runs-on: ubuntu-latest
    env:
      # synkro-products-api isn't started here; test 3 then expects the
      # forwarded request to end in 502/503 instead of the upstream's 401.
      PRODUCTS_API_AVAILABLE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Create the platform network
        run: docker network create platform
      - name: Build and start the gateway
        run: |
          cp .env.example .env
          cd deploy && docker compose --env-file ../.env up -d --build
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          exit 1
      - name: Run smoke tests
        run: |
          chmod +x tests/smoke.sh
          ./tests/smoke.sh
      - name: Gateway logs
        if: failure()
        run: cd deploy && docker compose logs
