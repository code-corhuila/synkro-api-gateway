# Included by every protected location: the shared base, plus the
# Authorization requirement, plus the general rate limit.
include /etc/nginx/snippets/gateway-base.conf;

# Presence check only — validity is each upstream's job (ADR-006). It
# follows the base include so the preflight above has already returned.
if ($http_authorization = "") {
    return 401;
}
error_page 401 = @unauthorized;

include /etc/nginx/snippets/gateway-rate-limit.conf;
