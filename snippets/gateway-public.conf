# Included by the public auth locations (login, refresh). Same as
# gateway-common.conf minus the Authorization requirement.

if ($request_method = OPTIONS) {
    include /etc/nginx/snippets/response-headers.conf;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
    add_header Access-Control-Max-Age 600 always;
    return 204;
}

error_page 502 503 504 = @upstream_unavailable;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_hide_header X-Correlation-Id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s;
