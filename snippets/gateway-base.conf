# Shared by every proxied location, public or protected: preflight,
# correlation ID and proxy headers, and 502/503 handling. It carries no
# Authorization check and no rate limit — those are what differ, so they
# live in gateway-protected.conf, gateway-public.conf and the login
# location. Deliberately declares no add_header outside the preflight
# block, so the server-level response headers (correlation ID, CORS) are
# inherited.

# Preflight: answered here, never forwarded, never needs a token. It must
# stay first so gateway-protected.conf's Authorization check never sees it.
if ($request_method = OPTIONS) {
    include /etc/nginx/snippets/response-headers.conf;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
    add_header Access-Control-Max-Age 600 always;
    return 204;
}

# NGINX-generated failures only (DNS miss, connection refused, timeout).
# proxy_intercept_errors stays off so an upstream's own 401/429/5xx
# reaches the client unchanged.
error_page 502 503 504 = @upstream_unavailable;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $correlation_id;
# The gateway owns this response header; drop the upstream echo so it
# is not sent twice.
proxy_hide_header X-Correlation-Id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s;
