services:
  synkro-api-gateway:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND}
      CUSTOMERS_LIST_RATE_PER_MINUTE: ${CUSTOMERS_LIST_RATE_PER_MINUTE:-30}
      CUSTOMERS_LIST_BURST: ${CUSTOMERS_LIST_BURST:-4}
      CUSTOMERS_LIST_MAX_CONCURRENT: ${CUSTOMERS_LIST_MAX_CONCURRENT:-2}
      CUSTOMERS_LIST_CONNECT_TIMEOUT_SECONDS: ${CUSTOMERS_LIST_CONNECT_TIMEOUT_SECONDS:-1}
      CUSTOMERS_LIST_SEND_TIMEOUT_SECONDS: ${CUSTOMERS_LIST_SEND_TIMEOUT_SECONDS:-2}
      CUSTOMERS_LIST_READ_TIMEOUT_SECONDS: ${CUSTOMERS_LIST_READ_TIMEOUT_SECONDS:-2}
    ports:
      - "8000:8000"
    networks: [platform]

networks:
  platform:
    external: true
