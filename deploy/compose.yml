services:
  synkro-api-gateway:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND}
    ports:
      - "8000:8000"
    networks: [platform]

networks:
  platform:
    external: true
